  acme: {api_key_env: ACME_KEY}
  globex: {api_key_env: GLOBEX_KEY}
documents:
  - {id: acme-loyalty, tenant: acme, topic: "the loyalty programme"}
  - {id: acme-returns, tenant: acme, topic: "returning an order", poisoned: true}
